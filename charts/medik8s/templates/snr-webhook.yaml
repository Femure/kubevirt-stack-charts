{{- if .Values.snr.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: self-node-remediation-webhook-service
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: self-node-remediation-operator
    {{- include "kubevirt-stack.labels" . | nindent 4 }}
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    control-plane: controller-manager
    self-node-remediation-operator: ""
---
apiVersion: v1
kind: Service
metadata:
  name: self-node-remediation-controller-manager-metrics-service
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: self-node-remediation-operator
    control-plane: controller-manager
    self-node-remediation-operator: ""
    {{- include "kubevirt-stack.labels" . | nindent 4 }}
spec:
  ports:
    - name: https
      port: 8443
      targetPort: https
  selector:
    control-plane: controller-manager
    self-node-remediation-operator: ""
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: self-node-remediation-mutating-webhook-configuration
  labels:
    app.kubernetes.io/name: self-node-remediation-operator
    {{- include "kubevirt-stack.labels" . | nindent 4 }}
  {{- if .Values.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Values.namespace }}/snr-serving-cert
  {{- end }}
webhooks:
  - name: mselfnoderemediationtemplate.kb.io
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: self-node-remediation-webhook-service
        namespace: {{ .Values.namespace }}
        path: /mutate-self-node-remediation-medik8s-io-v1alpha1-selfnoderemediationtemplate
    failurePolicy: Fail
    rules:
      - apiGroups:
          - self-node-remediation.medik8s.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - selfnoderemediationtemplates
    sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: self-node-remediation-validating-webhook-configuration
  labels:
    app.kubernetes.io/name: self-node-remediation-operator
    {{- include "kubevirt-stack.labels" . | nindent 4 }}
  {{- if .Values.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Values.namespace }}/snr-serving-cert
  {{- end }}
webhooks:
  - name: vselfnoderemediation.kb.io
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: self-node-remediation-webhook-service
        namespace: {{ .Values.namespace }}
        path: /validate-self-node-remediation-medik8s-io-v1alpha1-selfnoderemediation
    failurePolicy: Ignore
    rules:
      - apiGroups:
          - self-node-remediation.medik8s.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - selfnoderemediations
    sideEffects: None
  - name: vselfnoderemediationconfig.kb.io
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: self-node-remediation-webhook-service
        namespace: {{ .Values.namespace }}
        path: /validate-self-node-remediation-medik8s-io-v1alpha1-selfnoderemediationconfig
    failurePolicy: Fail
    rules:
      - apiGroups:
          - self-node-remediation.medik8s.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - selfnoderemediationconfigs
    sideEffects: None
  - name: vselfnoderemediationtemplate.kb.io
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: self-node-remediation-webhook-service
        namespace: {{ .Values.namespace }}
        path: /validate-self-node-remediation-medik8s-io-v1alpha1-selfnoderemediationtemplate
    failurePolicy: Fail
    rules:
      - apiGroups:
          - self-node-remediation.medik8s.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - selfnoderemediationtemplates
    sideEffects: None
{{- end }}
