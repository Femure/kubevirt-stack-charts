{{- if .Values.snr.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-node-remediation-controller-manager
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: self-node-remediation-operator
    control-plane: controller-manager
    self-node-remediation-operator: ""
    {{- include "kubevirt-stack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.snr.replicas }}
  selector:
    matchLabels:
      control-plane: controller-manager
      self-node-remediation-operator: ""
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        self-node-remediation-operator: ""
    spec:
      serviceAccountName: self-node-remediation-controller-manager
      priorityClassName: system-cluster-critical
      terminationGracePeriodSeconds: 15
      {{- include "kubevirt-stack.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: manager
          image: {{ include "kubevirt-stack.image" (dict "repository" .Values.snr.image.repository "tag" .Values.snr.image.tag "global" .Values.global) }}
          imagePullPolicy: IfNotPresent
          command:
            - /manager
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
            - --leader-elect
            - --is-manager
            - --enable-http2=false
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SELF_NODE_REMEDIATION_IMAGE
              value: {{ include "kubevirt-stack.image" (dict "repository" .Values.snr.image.repository "tag" .Values.snr.image.tag "global" .Values.global) }}
            - name: DEPLOYMENT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
            - containerPort: 8443
              name: https
              protocol: TCP
          startupProbe:
            failureThreshold: 12
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 20
          {{- with .Values.snr.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - name: cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        {{- include "kubevirt-stack.nodeSelector" (dict "global" .Values.global.nodeSelector "local" .Values.snr.nodeSelector) | nindent 8 }}
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      {{- $tolerations := include "kubevirt-stack.tolerations" (dict "global" .Values.global.tolerations "local" .Values.snr.tolerations) -}}
      {{- if $tolerations }}
        {{- $tolerations | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              control-plane: controller-manager
              self-node-remediation-operator: ""
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
      volumes:
        - name: cert
          secret:
            defaultMode: 420
            secretName: snr-webhook-server-cert
{{- end }}
