global:
  imageRegistry: ""
  imagePullSecrets: []
  nodeSelector: {}
  tolerations: []

namespace: hostpath-provisioner
version: v0.25.0

## WARNING: Use a dedicated partition, NOT a directory on the OS disk!
## Requires cert-manager to be installed in the cluster.
storagePath: /var/hpvolumes
storagePools: []

operator:
  nodeSelector: {}
  tolerations: []
  priorityClassName: ""
  resources:
    requests:
      cpu: 10m
      memory: 150Mi
    limits: {}
  images:
    operator:
      repository: quay.io/kubevirt/hostpath-provisioner-operator
      tag: ""
    provisioner:
      repository: quay.io/kubevirt/hostpath-provisioner
      tag: ""
    csiDriver:
      repository: quay.io/kubevirt/hostpath-csi-driver
      tag: ""
    nodeDriverRegistrar:
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: v2.2.0
    livenessProbe:
      repository: registry.k8s.io/sig-storage/livenessprobe
      tag: v2.3.0
    csiSnapshotter:
      repository: registry.k8s.io/sig-storage/csi-snapshotter
      tag: v8.2.0
    csiProvisioner:
      repository: registry.k8s.io/sig-storage/csi-provisioner
      tag: v3.4.1

storageClass:
  isDefault: true

webhook:
  failurePolicy: Ignore
certManager:
  reloader: true
  issuer:
    name: ""
    kind: Issuer
    group: cert-manager.io
